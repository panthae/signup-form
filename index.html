<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="contanier">
        <div class="logo">
            <div class="lll">
                <img src="leave copy.jpg" width="100" alt="leaves"
                <span class="logo">ODIN</span>
            </div>
            <div class="credit">
                Photo by <a href="https://unsplash.com" target="_blank"></a>
            </div>
        </div>

        <div class="kkk">
            <div class="text">
                <p>This is not a real online service! You know
                        you need something like this in your life to
                        help you realize your deepest dreams.
                        Sign up now to get started.
                </p>
                <p>You know you want to.</p>
            </div>
            <form class="Signup">
                <h2>Let's do this!</h2>

                <div class="main_font">
                    <div class="font">
                        <label for="firstrname">First Name</label>
                        <input type="text" id="first_name" name="first_name">
                    </div>

                    <div class="font">
                        <label for="lastname">Last Name</label>
                        <input type="text" id="Last_name" name="Last_name">
                    </div>
                </div>

                <div class="main_font">
                    <div class="font">
                        <label for="Email">Email</label>
                        <input type="email" id="user_email" name="user_email">
                    </div>

                    <div class="font">
                        <label for="num">Phone Number</label>
                        <input type="number" id="user_number" name="user_number">
                    </div>
                </div>


            <div class="main_font">
                    <div class="font">
                        <label for="password">*Password</label>
                        <input type="password" id="user_password" name="user_password" required>
                    </div>

                    <div class="font">
                        <label for="Confirm password">Confirm Password</label>
                        <input type="password" id="Confirm_password" name="Confirm_password" required>
                    </div>
                </div>
             </form>
        </div>

    </div>
    
</body>
