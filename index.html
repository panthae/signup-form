<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <div class="logo">
            <div class="background_image"></div>
                <img src="leave copy.jpg" alt="leaves">
            </div>
            <div class="logo_image">
                <img src="Odin copy.jpg" alt="odin logo">
                <span>Odin</span>
            </div>
            <div class="link">
                Photo by <a href="https://unsplash.com" target="_blank">Link</a>
            </div>
        </div>

        <div class="kkk">
            <div class="text">
                <p>This is not a real online service! You know
                        you need something like this in your life to
                        help you realize your deepest dreams.
                        Sign up now to get started.
                </p>
                <p>You know you want to.</p>
            </div>
            <form action="" method="post">
                <h2>Let's do this!</h2>

                <div class="main_font">
                    <div class="font">
                        <label for="first_name">First Name</label>
                        <input type="text" id="first_name" name="first_name">
                    </div>

                    <div class="font">
                        <label for="last_name">Last Name</label>
                        <input type="text" id="Last_name" name="Last_name">
                    </div>
                </div>

                <div class="main_font">
                    <div class="font">
                        <label for="user_email">Email</label>
                        <input type="email" id="user_email" name="user_email">
                    </div>

                    <div class="font">
                        <label for="user_number">Phone Number</label>
                        <input type="number" id="user_number" name="user_number">
                    </div>
                </div>


                <div class="main_font">
                    <div class="font">
                        <label for="user_password">*Password</label>
                        <input type="password" id="user_password" name="user_password" minlength="6" required>
                    </div>

                    <div class="font">
                        <label for="Confirm_password">Confirm Password</label>
                        <input type="password" id="Confirm_password" name="Confirm_password" required>
                    </div>
                </div>
             </form>

             <div class="btn">
                <button type="submit">Creat Account</button>
                <p>Already have an account ? <a href="#">Login</a></p>
             </div>
        </div>

    </div>
    
</body>
</html>
